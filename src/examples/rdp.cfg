# RDP port forwarding for a small farm.
#
# Windows: log path under C:\Soft\lsh-utproxy\logs\, service installed with
#          deploy\install-service.ps1
# Linux:   log path under /opt/lsh-utproxy/logs/, unit in deploy/lsh-utproxy.service
#
# Why "timeout tunnel": an idle RDP session (locked screen, no mouse movement)
# sends no data. timeout tunnel is the inactivity timer that applies to both
# directions, so it, not timeout client/server, decides when the session dies.
#
# Why "balance source": several RDP servers should keep the same user on the
# same server while a farm is not using a shared profile.

global
  log C:\Soft\lsh-utproxy\logs\lsh-utproxy.log format json level info
  maxconn 4000
  grace shutdown 10s

defaults
  mode tcp
  balance source
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout tunnel 3600s
  timeout check 3s
  option tcpkeepalive

listen rdp
  mode tcp
  bind 0.0.0.0:3389
  maxconn 2000
  timeout tunnel 3600s
  # Access rules in file order: the first match wins. Only the office and the
  # VPN pool get in, the known scanner network is refused with a reset, and
  # everything else is closed. "deny all" at the end makes this a whitelist.
  allow 10.9.9.0/24
  allow 10.20.0.0/16
  allow 192.168.1.0/24
  deny 212.23.1.0/24
  deny all
  server rdp1 10.9.9.3:3389 check inter 10s fall 3 rise 2
  server rdp2 10.9.9.4:3389 check inter 10s fall 3 rise 2
  server rdp-spare 10.9.9.9:3389 backup check inter 30s

# To expose RDP on a non-standard public port instead:
#
# listen rdp_public
#   mode tcp
#   bind 203.0.113.10:33390
#   balance source
#   timeout tunnel 3600s
#   allow 10.9.9.0/24
#   deny all
#   server rdp1 10.9.9.3:3389 check inter 10s
