# lsh-utproxy — reference config: every directive the parser understands.
# Directives are line-based: a directive and all of its arguments must be on
# one line. '#' starts a comment. Quoting with "..." is supported.

global
  # log <target> [format json|raw] [level trace|debug|info|warn|error|none]
  # <target> is stdout, stderr or a file path (append mode).
  log /opt/lsh-utproxy/logs/lsh-utproxy.log format json level info
  maxconn 65535              # process-wide concurrent connections
  maxprocs 0                 # GOMAXPROCS, 0 = all CPUs ("nbproc" also accepted)
  grace shutdown 10s         # how long established connections may drain
  stats timeout 10s          # reserved: no stats socket is implemented yet
  # chroot /srv/lsh-utproxy  # Linux only, applied after the sockets are bound
  # user lshutproxy          # Linux only
  # group lshutproxy         # Linux only

defaults
  mode tcp                   # tcp | udp
  balance roundrobin         # roundrobin | leastconn | source
  timeout connect 5s         # dial to a backend server
  timeout client 30s         # inactivity on the client side
  timeout server 30s         # inactivity on the backend side
  timeout tunnel 3600s       # inactivity in either direction; wins over the two above
  timeout check 2s           # health check dial timeout
  maxconn 0                  # per-section connection limit, 0 = unlimited
  option tcpkeepalive        # keepalive on both sockets ("option tcpka" as well)
  # tcp-keepalive [idle <t>] [intvl <t>] [cnt <n>]
  # idle works everywhere; intvl and cnt are Linux-only (TCP_KEEPINTVL/KEEPCNT).
  tcp-keepalive idle 30s intvl 5s cnt 3
  re-use-port                # SO_REUSEPORT, Linux only, allowed in "defaults" only
  udp-session-ttl 30s        # UDP session lifetime without traffic
  udp-max-sessions 20000     # UDP sessions per frontend
  udp-buffer-size 65536      # UDP read buffer

# --- frontend + backend pair -------------------------------------------------

frontend fe_tcp
  mode tcp
  bind 0.0.0.0:8080          # host:port, *:port, [::]:port, ":port", host name:port
  bind [::]:8080             # several bind lines are allowed
  default_backend be_tcp
  maxconn 10000
  timeout client 30s
  timeout tunnel 3600s
  option tcpkeepalive
  # Access rules: one address per line, evaluated in the order written. The
  # first rule that matches the client address wins, so put exceptions first
  # and the wide rules last. Forms: CIDR, single IP, "localhost", "all".
  # deny = reset the client at once (iptables REJECT), drop = close silently
  # (iptables DROP). If nothing matches, the traffic is allowed.
  allow 10.9.9.0/24
  allow 192.168.1.0/24
  allow 203.0.113.7          # a single host
  drop 173.24.5.0/24         # a spam source: no answer, it hangs
  deny 212.23.1.0/24         # a scanner: the client sees "connection refused"
  deny all                   # whitelist-only: everything else is refused
  # acl / use_backend are parsed but not applied yet

backend be_tcp
  mode tcp
  # allow/deny/drop belong to a frontend or listen section: a rule in a
  # backend, defaults or global is a startup error.
  balance leastconn
  maxconn 5000
  timeout connect 3s
  timeout server 60s
  timeout tunnel 3600s
  option tcpkeepalive
  # name address [check] [backup] [weight N] [maxconn N] [inter T] [rise N] [fall N]
  server w1 10.0.0.10:8080 check inter 5s rise 2 fall 3 maxconn 500 weight 3
  server w2 10.0.0.11:8080 check inter 5s rise 2 fall 3 maxconn 500
  server w3 10.0.0.12:8080 backup check inter 5s

# --- listen: one section that is a frontend and a backend at once -------------

listen rdp
  mode tcp
  bind 0.0.0.0:33390
  balance source             # sticky by client IP, what RDP farms usually want
  maxconn 2000
  timeout connect 5s
  timeout tunnel 3600s       # an idle RDP session survives one hour
  # only the office and the VPN pool may reach RDP; a scanner is refused
  allow 10.9.9.0/24
  allow 10.20.0.0/16
  deny 212.23.1.0/24
  deny all
  server rdp1 10.9.9.3:3389 check inter 10s fall 3 rise 2
  server rdp2 10.9.9.4:3389 check inter 10s fall 3 rise 2 backup

# --- UDP ---------------------------------------------------------------------

listen dns
  mode udp
  bind 0.0.0.0:5353
  balance roundrobin
  udp-session-ttl 40s
  udp-max-sessions 100000
  udp-buffer-size 65536
  # deny and drop both discard the datagram (no ICMP answer from a userspace
  # proxy); the rule is what shows in the log
  allow 10.9.9.0/24
  allow localhost
  drop all
  server dns1 8.8.8.8:53
  server dns2 1.1.1.1:53
