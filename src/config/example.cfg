# lsh-utproxy — getting started config.
#
# Log to the console while testing; switch "log stdout" to a file path when the
# program runs as a service:
#     log C:\Soft\lsh-utproxy\logs\lsh-utproxy.log   (Windows)
#     log /opt/lsh-utproxy/logs/lsh-utproxy.log      (Linux)

global
  log stdout format json level info
  maxconn 65535
  grace shutdown 10s

defaults
  mode tcp
  balance roundrobin
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  # tunnel is the inactivity timer for an idle session in either direction.
  # It wins over timeout idle/client/server, so long-lived RDP/VPN sessions
  # need it long.
  timeout tunnel 3600s
  timeout check 2s
  option tcpkeepalive
  # SO_REUSEPORT, Linux only (ignored with a warning elsewhere)
  re-use-port
  udp-max-sessions 20000
  udp-session-ttl 30s
  udp-buffer-size 65536

# --- TCP: forward 8080 to two workers, the second one only when the first is down ---

frontend fe_tcp
  mode tcp
  bind 0.0.0.0:8080
  default_backend be_tcp
  maxconn 10000
  # Access rules, in file order, one address per line: the first rule that
  # matches the client address wins, so the exceptions come first. deny answers
  # with a reset ("connection refused"), drop closes silently (the client
  # hangs until its own timeout). If nothing matches, traffic is allowed, so
  # "deny all" as the last line makes this a whitelist.
  allow 10.9.9.0/24
  allow localhost
  drop 173.24.5.0/24
  deny 212.23.1.0/24
  deny all

backend be_tcp
  mode tcp
  balance roundrobin
  option tcpkeepalive
  timeout connect 3s
  server srv1 127.0.0.1:9090 check inter 2s rise 2 fall 3 maxconn 200
  server srv2 127.0.0.1:9091 check inter 2s rise 2 fall 3 backup

# --- UDP: DNS to public resolvers, sessions tracked per client endpoint ---

frontend fe_udp
  mode udp
  bind 0.0.0.0:5353
  default_backend be_dns

backend be_dns
  mode udp
  balance roundrobin
  udp-session-ttl 30s
  udp-max-sessions 50000
  # No "check" here: a UDP connect check cannot prove a resolver is alive, it
  # only reports "up". Rely on the session TTL and on the client retrying.
  server dns1 8.8.8.8:53
  server dns2 1.1.1.1:53
  server dns3 9.9.9.9:53 backup
