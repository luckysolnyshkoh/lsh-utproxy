# lsh-utproxy — getting started config.
#
# Log to the console while testing; switch "log stdout" to a file path when the
# program runs as a service:
#     log C:\Soft\lsh-utproxy\logs\lsh-utproxy.log   (Windows)
#     log /opt/lsh-utproxy/logs/lsh-utproxy.log      (Linux)

global
  log stdout format json level info
  maxconn 65535
  grace shutdown 10s

defaults
  mode tcp
  balance roundrobin
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  # tunnel is the inactivity timer for an idle session in either direction.
  # It wins over timeout idle/client/server, so long-lived RDP/VPN sessions
  # need it long.
  timeout tunnel 3600s
  timeout check 2s
  option tcpkeepalive
  # SO_REUSEPORT, Linux only (ignored with a warning elsewhere)
  re-use-port
  udp-max-sessions 20000
  udp-session-ttl 30s
  udp-buffer-size 65536

listen rdp
  mode tcp
  bind 0.0.0.0:33389
  maxconn 2000
  timeout tunnel 3600s
  server rdp1 192.168.255.2:3389 check inter 10s fall 3 rise 2
  #server rdp2 10.9.9.4:3389 check inter 10s fall 3 rise 2
  #server rdp-spare 10.9.9.9:3389 backup check inter 30s
