global
  log stdout format json level info
  maxconn 65535
  maxprocs 0
  grace shutdown 10s

defaults
  mode tcp
  balance roundrobin
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout tunnel 3600s
  timeout idle 60s
  timeout check 2s
  option tcpkeepalive
  re-use-port
  udp-max-sessions 20000
  udp-session-ttl 30s
  udp-buffer-size 65536

listen udp53
  mode udp
  bind 10.255.241.10:53
  balance roundrobin
  timeout idle 40s
  udp-session-ttl 40s
  udp-max-sessions 100000
  server s1 1.1.1.1:53
  server s2 8.8.8.8:53
  server s3 8.8.4.4:53

listen tcp11414
  mode tcp
  bind 10.255.241.10:11414
  balance roundrobin
  timeout idle 40s
  udp-session-ttl 40s
  udp-max-sessions 100000
  server s1 127.0.0.1:1414
