global
  log stdout format json level info
  maxconn 65535
  maxprocs 0
  grace shutdown 10s

defaults
  mode tcp
  balance roundrobin
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout tunnel 3600s
  timeout idle 60s
  timeout check 2s
  option tcpkeepalive
  re-use-port
  udp-max-sessions 20000
  udp-session-ttl 30s
  udp-buffer-size 65536

frontend fe_tcp
  mode tcp
  bind 0.0.0.0:8080
  default_backend be_tcp
  maxconn 10000
  timeout client 30s

backend be_tcp
  mode tcp
  balance roundrobin
  option tcpkeepalive
  timeout connect 3s
  timeout server 30s
  timeout idle 60s
  server srv1 127.0.0.1:9090 check inter 2s rise 2 fall 3
  server srv2 127.0.0.1:9091 check inter 2s rise 2 fall 3 backup

frontend fe_udp
  mode udp
  bind 0.0.0.0:5353
  default_backend be_dns
  maxconn 20000

backend be_dns
  mode udp
  balance roundrobin
  timeout connect 500ms
  timeout server 5s
  timeout idle 30s
  udp-session-ttl 30s
  udp-max-sessions 50000
  server dns1 8.8.8.8:53
  server dns2 1.1.1.1:53
  server dns3 9.9.9.9:53