global
  log stdout format json level debug
  maxconn 1048576
  maxprocs 4
  grace shutdown 15s

defaults
  mode tcp
  balance leastconn
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout tunnel 7200s
  timeout idle 120s
  timeout check 3s
  option tcpkeepalive
  re-use-port

frontend fe_all_tcp
  mode tcp
  bind 0.0.0.0:8000
  bind 0.0.0.0:8001
  default_backend be_workers

backend be_workers
  mode tcp
  balance leastconn
  server w1 10.0.0.10:8080 check inter 1s rise 3 fall 5 maxconn 500
  server w2 10.0.0.11:8080 check inter 1s rise 3 fall 5 maxconn 500
  server w3 10.0.0.12:8080 check inter 1s rise 3 fall 5 maxconn 500 backup

listen udp_app
  mode udp
  bind 0.0.0.0:9000
  balance roundrobin
  timeout idle 40s
  udp-session-ttl 40s
  udp-max-sessions 100000
  server u1 10.0.0.20:9000
  server u2 10.0.0.21:9000